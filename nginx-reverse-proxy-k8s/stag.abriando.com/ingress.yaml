apiVersion: networking.k8s.io/v1 
kind: Ingress
metadata:
  name: reverse-proxy-abriando-ingress 
  namespace: reverse-proxy 
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: 'stag.abriando.com'
    http:
      paths:
      - backend:
          service: 
            name: reverse-proxy-abriando-svc 
            port: 
              number: 80
        path: /
        pathType: ImplementationSpecific
